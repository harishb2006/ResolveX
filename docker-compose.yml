version: '3.8'

services:
  db:
    image: postgres:15
    container_name: resolvex_db
    environment:
      POSTGRES_USER: resolvex_user
      POSTGRES_PASSWORD: resolvex_password
      POSTGRES_DB: resolvex_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
